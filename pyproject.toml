[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-public-video-collector"
version = "0.1.0"
description = "CLI MVP for collecting public YouTube video/channel metadata for shopping and affiliate content analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "typer>=0.12,<1",
  "youtube-transcript-api>=1.2,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]
scrapling = [
  "scrapling[fetchers]>=0.4.9,<1",
  "apify-fingerprint-datapoints==0.13.0",
]

[project.scripts]
yt-collector = "yt_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
