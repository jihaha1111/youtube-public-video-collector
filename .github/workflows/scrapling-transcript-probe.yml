name: Scrapling transcript probe

on:
  workflow_dispatch:
    inputs:
      url:
        description: YouTube watch/shorts/youtu.be URL to probe
        required: true
        default: https://www.youtube.com/watch?v=Tb6DhFy9N_A
      language:
        description: Preferred caption language code
        required: true
        default: ko
      timeout_ms:
        description: Scrapling browser timeout in milliseconds
        required: true
        default: "90000"
      wait_ms:
        description: Extra wait after page load in milliseconds
        required: true
        default: "5000"
      headless:
        description: Run browser headless
        type: boolean
        required: true
        default: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project with Scrapling support
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[scrapling]"

      - name: Install Chromium for Scrapling/Patchright
        run: python -m patchright install --with-deps chromium

      - name: Run Scrapling transcript probe
        env:
          SCRAPLING_PROXY_URL: ${{ secrets.SCRAPLING_PROXY_URL }}
        run: |
          mkdir -p output
          HEADLESS_FLAG="--headless"
          if [ "${{ inputs.headless }}" != "true" ]; then
            HEADLESS_FLAG="--headed"
          fi
          python -m yt_collector.cli scrapling-transcript \
            --url "${{ inputs.url }}" \
            --language "${{ inputs.language }}" \
            --timeout-ms "${{ inputs.timeout_ms }}" \
            --wait-ms "${{ inputs.wait_ms }}" \
            $HEADLESS_FLAG \
            --out output/scrapling_transcript_probe.json

      - name: Upload probe result
        uses: actions/upload-artifact@v4
        with:
          name: scrapling-transcript-probe
          path: output/scrapling_transcript_probe.json
          if-no-files-found: error
