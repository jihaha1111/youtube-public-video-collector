name: Video list public transcripts

on:
  workflow_dispatch:
    inputs:
      queue:
        description: Prepared public-caption fallback queue ID
        required: true
        type: string
      language:
        description: Preferred public caption language code
        required: true
        default: ko
      timeout_seconds:
        description: Per-request HTTP timeout in seconds
        required: true
        default: "20"
      sleep_seconds:
        description: Delay between requests within each shard
        required: true
        default: "0"
      stop_on_ip_block:
        description: Skip remaining targets in a shard after an IP block
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: video-list-public-transcripts-${{ inputs.queue }}
  cancel-in-progress: false

jobs:
  prepare-shards:
    name: prepare public transcript shards
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      max_parallel: ${{ steps.prepare.outputs.max_parallel }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare explicit target shards
        id: prepare
        env:
          QUEUE_ID: ${{ inputs.queue }}
          INPUT_LANGUAGE: ${{ inputs.language }}
          INPUT_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          INPUT_SLEEP_SECONDS: ${{ inputs.sleep_seconds }}
          INPUT_STOP_ON_IP_BLOCK: ${{ inputs.stop_on_ip_block }}
        run: |
          mkdir -p prepared/shards
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          queue_id = os.environ["QUEUE_ID"]
          if queue_id == "food-story-new-11-public-fallback-smoke-v1":
              source_file = Path("inputs/food-story-new-11-public-fallback-smoke-v1/targets.txt")
              expected_target_count = 2
              shard_size = 1
              max_parallel = 2
          elif queue_id == "food-story-new-11-public-fallback-v1":
              source_file = Path("inputs/food-story-new-11-public-fallback-v1/targets.txt")
              expected_target_count = 24
              shard_size = 4
              max_parallel = 6
          else:
              raise SystemExit(f"Unsupported public transcript queue: {queue_id}")

          target_text = source_file.read_text(encoding="utf-8")
          targets = [line.strip() for line in target_text.splitlines() if line.strip()]
          if len(targets) != expected_target_count:
              raise SystemExit(
                  f"Expected {expected_target_count} targets, received {len(targets)}"
              )
          if len(set(targets)) != len(targets):
              raise SystemExit("Prepared public transcript queue contains duplicate video IDs")
          for video_id in targets:
              if not re.fullmatch(r"[A-Za-z0-9_-]{11}", video_id):
                  raise SystemExit(f"Invalid video ID: {video_id}")

          shards = [
              targets[index:index + shard_size]
              for index in range(0, len(targets), shard_size)
          ]
          matrix = []
          for index, shard in enumerate(shards, start=1):
              shard_id = f"{index:02d}"
              shard_path = Path(f"prepared/shards/shard-{shard_id}.txt")
              shard_path.write_text("\n".join(shard) + "\n", encoding="utf-8")
              matrix.append({"shard": shard_id})

          all_targets = "\n".join(targets) + "\n"
          Path("prepared/all_targets.txt").write_text(all_targets, encoding="utf-8")
          manifest = {
              "schema_version": 1,
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "git_revision": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "queue_id": queue_id,
              "target_count": len(targets),
              "targets_sha256": hashlib.sha256(all_targets.encode()).hexdigest(),
              "shard_count": len(shards),
              "shard_size": shard_size,
              "max_parallel": max_parallel,
              "settings": {
                  "language": os.environ["INPUT_LANGUAGE"],
                  "timeout_seconds": float(os.environ["INPUT_TIMEOUT_SECONDS"]),
                  "sleep_seconds": float(os.environ["INPUT_SLEEP_SECONDS"]),
                  "stop_on_ip_block": os.environ["INPUT_STOP_ON_IP_BLOCK"] == "true",
              },
          }
          Path("prepared/run_manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
              output.write(f"max_parallel={max_parallel}\n")
          print(
              f"queue={queue_id} targets={len(targets)} "
              f"shards={len(shards)} max_parallel={max_parallel}"
          )
          PY

      - name: Upload prepared public transcript shards
        uses: actions/upload-artifact@v4
        with:
          name: public-transcript-shard-prepared
          path: prepared/*
          if-no-files-found: error

  probe-shards:
    name: probe public transcript shard ${{ matrix.shard }}
    needs: prepare-shards
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare-shards.outputs.max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.prepare-shards.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Download prepared public transcript shards
        uses: actions/download-artifact@v4
        with:
          name: public-transcript-shard-prepared
          path: prepared

      - name: Fetch public transcript shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p shard-results
          BLOCK_FLAG="--stop-on-ip-block"
          if [ "${{ inputs.stop_on_ip_block }}" != "true" ]; then
            BLOCK_FLAG="--keep-going"
          fi
          python -m yt_collector.cli public-transcript-list \
            --targets-file "prepared/shards/shard-${SHARD}.txt" \
            --limit 0 \
            --language "${{ inputs.language }}" \
            --timeout-seconds "${{ inputs.timeout_seconds }}" \
            --sleep-seconds "${{ inputs.sleep_seconds }}" \
            $BLOCK_FLAG \
            --out "shard-results/shard-${SHARD}.json"

      - name: Validate public transcript shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          shard = os.environ["SHARD"]
          targets = [
              line.strip()
              for line in Path(f"prepared/shards/shard-{shard}.txt")
              .read_text(encoding="utf-8")
              .splitlines()
              if line.strip()
          ]
          payload = json.loads(
              Path(f"shard-results/shard-{shard}.json").read_text(encoding="utf-8")
          )
          videos = payload.get("videos") or []
          summary = payload.get("transcript_collection") or {}
          if [video.get("video_id") for video in videos] != targets:
              raise SystemExit(f"Shard {shard} target order mismatch")
          if summary.get("attempted") != len(targets):
              raise SystemExit(f"Shard {shard} attempted count mismatch")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload public transcript shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-transcript-shard-result-${{ matrix.shard }}
          path: shard-results/shard-${{ matrix.shard }}.json
          if-no-files-found: warn

  finalize-shards:
    name: merge public transcript shard results
    needs:
      - prepare-shards
      - probe-shards
    if: ${{ always() && needs.prepare-shards.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Download prepared public transcript state
        uses: actions/download-artifact@v4
        with:
          name: public-transcript-shard-prepared
          path: prepared

      - name: Download public transcript shard results
        uses: actions/download-artifact@v4
        with:
          pattern: public-transcript-shard-result-*
          path: all-shard-results
          merge-multiple: true

      - name: Merge public transcript results
        run: |
          mkdir -p merged
          python - <<'PY'
          import collections
          import hashlib
          import json
          from pathlib import Path

          target_text = Path("prepared/all_targets.txt").read_text(encoding="utf-8")
          target_ids = [line for line in target_text.splitlines() if line]
          manifest = json.loads(Path("prepared/run_manifest.json").read_text(encoding="utf-8"))
          by_id = {}
          shard_summaries = []
          for result_path in sorted(Path("all-shard-results").glob("shard-*.json")):
              payload = json.loads(result_path.read_text(encoding="utf-8"))
              shard_summaries.append(
                  {"file": result_path.name, **(payload.get("transcript_collection") or {})}
              )
              for video in payload.get("videos") or []:
                  video_id = video.get("video_id")
                  if video_id in by_id:
                      raise SystemExit(f"Duplicate result video ID: {video_id}")
                  by_id[video_id] = video

          missing_results = [video_id for video_id in target_ids if video_id not in by_id]
          if missing_results:
              raise SystemExit(f"Missing shard results for {len(missing_results)} targets")
          videos = [by_id[video_id] for video_id in target_ids]
          found = [
              video for video in videos
              if (video.get("transcript") or {}).get("status") == "found"
          ]
          missing = [video for video in videos if video not in found]
          error_codes = collections.Counter()
          for video in missing:
              for error in (video.get("transcript") or {}).get("errors") or []:
                  error_codes[str(error.get("code") or "unknown")] += 1

          payload = {
              "schema_version": "public-transcript-list-sharded-1",
              "run_manifest": manifest,
              "transcript_collection": {
                  "source": "youtube-transcript-api-with-watch-page-fallback",
                  "requested": len(target_ids),
                  "returned": len(videos),
                  "found": len(found),
                  "missing": len(missing),
                  "targets_sha256": hashlib.sha256(target_text.encode()).hexdigest(),
                  "error_code_counts": dict(sorted(error_codes.items())),
                  "shards": shard_summaries,
              },
              "videos": videos,
          }
          Path("merged/video_list_public_transcripts.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          Path("merged/retry_targets.txt").write_text(
              "".join(f"{video['video_id']}\n" for video in missing),
              encoding="utf-8",
          )
          Path("merged/merge_summary.json").write_text(
              json.dumps(payload["transcript_collection"], ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload["transcript_collection"], ensure_ascii=False, indent=2))
          PY

      - name: Upload merged public transcript result
        uses: actions/upload-artifact@v4
        with:
          name: video-list-public-transcripts-sharded
          path: |
            prepared/all_targets.txt
            prepared/run_manifest.json
            merged/video_list_public_transcripts.json
            merged/retry_targets.txt
            merged/merge_summary.json
          if-no-files-found: error
