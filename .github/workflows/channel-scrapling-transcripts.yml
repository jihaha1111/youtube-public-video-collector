name: Channel Scrapling transcripts

on:
  workflow_dispatch:
    inputs:
      url:
        description: Seed YouTube watch/shorts/youtu.be URL for the channel
        required: true
        default: https://www.youtube.com/watch?v=Tb6DhFy9N_A
      limit:
        description: Number of ranked channel videos to transcript-test first; 0 means all ranked public candidates
        required: true
        default: "5"
      language:
        description: Preferred rendered transcript language code; metadata-only skips transcript collection
        required: true
        default: ko
      timeout_ms:
        description: Scrapling browser timeout in milliseconds
        required: true
        default: "90000"
      wait_ms:
        description: Maximum post-load DOM settle wait before condition-based transcript checks
        required: true
        default: "500"
      sleep_seconds:
        description: Delay between Scrapling transcript requests; 0 disables inter-video waiting
        required: true
        default: "0"
      headless:
        description: Run browser headless
        type: boolean
        required: true
        default: true
      include_non_shorts:
        description: Include non-Shorts videos
        type: boolean
        required: true
        default: false

jobs:
  collect-and-transcript:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project with Scrapling support
        if: inputs.language != 'metadata-only'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[scrapling]"

      - name: Install metadata collector only
        if: inputs.language == 'metadata-only'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Install Chromium for Scrapling/Patchright
        if: inputs.language != 'metadata-only'
        run: python -m patchright install --with-deps chromium

      - name: Probe single-video rendered DOM transcript hard gate
        if: inputs.language != 'metadata-only'
        env:
          SCRAPLING_PROXY_URL: ${{ secrets.SCRAPLING_PROXY_URL }}
        run: |
          mkdir -p output
          HEADLESS_FLAG="--headless"
          if [ "${{ inputs.headless }}" != "true" ]; then
            HEADLESS_FLAG="--headed"
          fi
          python -m yt_collector.cli scrapling-transcript \
            --url "https://www.youtube.com/watch?v=Tb6DhFy9N_A" \
            --language "${{ inputs.language }}" \
            --timeout-ms "${{ inputs.timeout_ms }}" \
            --wait-ms "${{ inputs.wait_ms }}" \
            $HEADLESS_FLAG \
            --out output/scrapling_dom_probe.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("output/scrapling_dom_probe.json").read_text(encoding="utf-8"))
          transcript = payload.get("transcript") or {}
          source = transcript.get("source")
          segments = transcript.get("segments") or []
          forbidden = ("captionTracks", "timedtext", "youtube_transcript_api")
          if transcript.get("status") != "found":
              raise SystemExit(f"DOM transcript probe did not find transcript: {transcript!r}")
          if source != "scrapling_rendered_dom_transcript":
              raise SystemExit(f"Unexpected transcript source: {source!r}")
          if len(segments) < 8:
              raise SystemExit(f"Expected at least 8 DOM segments, got {len(segments)}")
          source_blob = json.dumps(source, ensure_ascii=False)
          if any(marker in source_blob for marker in forbidden):
              raise SystemExit(f"Forbidden non-DOM transcript source marker in {source!r}")
          PY

      - name: Upload single-video DOM probe artifact
        if: always() && inputs.language != 'metadata-only'
        uses: actions/upload-artifact@v4
        with:
          name: scrapling-dom-probe
          path: output/scrapling_dom_probe.json
          if-no-files-found: error

      - name: Collect channel metadata inside Actions
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CHANNEL_SEED_URLS: ${{ inputs.url }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::error::Set the YOUTUBE_API_KEY repository secret before running this workflow."
            exit 1
          fi
          mkdir -p output
          python - <<'PY'
          import os
          from pathlib import Path

          urls = []
          seen = set()
          for raw_line in os.environ["CHANNEL_SEED_URLS"].splitlines():
              url = raw_line.strip()
              if not url or url in seen:
                  continue
              if not url.startswith(("https://www.youtube.com/watch?v=", "https://youtube.com/watch?v=", "https://www.youtube.com/shorts/", "https://youtube.com/shorts/", "https://youtu.be/")):
                  raise SystemExit(f"Unsupported YouTube seed URL: {url}")
              seen.add(url)
              urls.append(url)

          if not urls:
              raise SystemExit("No valid YouTube seed URLs were provided")

          Path("output/channel_seed_urls.txt").write_text(
              "\n".join(urls) + "\n",
              encoding="utf-8",
          )
          print(f"channel_seed_count={len(urls)}")
          PY
          SEED_COUNT="$(wc -l < output/channel_seed_urls.txt | tr -d ' ')"
          if [ "$SEED_COUNT" = "1" ]; then
            python -m yt_collector.cli collect \
              --url "$(head -n 1 output/channel_seed_urls.txt)" \
              --limit "${{ inputs.limit }}" \
              --format json \
              --out output/channel_collection.json
          else
            python -m yt_collector.cli collect \
              --urls-file output/channel_seed_urls.txt \
              --limit "${{ inputs.limit }}" \
              --format json \
              --out output/channel_collection.json
          fi

      - name: Fetch rendered DOM transcripts through Scrapling inside Actions
        if: inputs.language != 'metadata-only'
        env:
          SCRAPLING_PROXY_URL: ${{ secrets.SCRAPLING_PROXY_URL }}
        run: |
          HEADLESS_FLAG="--headless"
          if [ "${{ inputs.headless }}" != "true" ]; then
            HEADLESS_FLAG="--headed"
          fi
          INCLUDE_FLAG=""
          if [ "${{ inputs.include_non_shorts }}" = "true" ]; then
            INCLUDE_FLAG="--include-non-shorts"
          fi
          python -m yt_collector.cli scrapling-transcripts \
            --collection output/channel_collection.json \
            --limit "${{ inputs.limit }}" \
            --language "${{ inputs.language }}" \
            --timeout-ms "${{ inputs.timeout_ms }}" \
            --wait-ms "${{ inputs.wait_ms }}" \
            --sleep-seconds "${{ inputs.sleep_seconds }}" \
            --stop-on-block \
            $HEADLESS_FLAG \
            $INCLUDE_FLAG \
            --out output/channel_scrapling_transcripts.json

      - name: Summarize result
        if: inputs.language != 'metadata-only'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('output/channel_scrapling_transcripts.json').read_text(encoding='utf-8'))
          summary = payload.get('transcript_collection', {})
          print('attempted=', summary.get('attempted'))
          print('found=', summary.get('found'))
          print('missing=', summary.get('missing'))
          print('stopped_by_block=', summary.get('stopped_by_block'))
          PY

      - name: Upload collection and transcript artifacts
        uses: actions/upload-artifact@v4
        with:
          name: channel-scrapling-transcripts
          path: |
            output/channel_collection.json
            output/channel_seed_urls.txt
            output/channel_scrapling_transcripts.json
            output/scrapling_dom_probe.json
          if-no-files-found: error
