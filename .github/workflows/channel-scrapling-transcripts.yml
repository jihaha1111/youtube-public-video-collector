name: Channel Scrapling transcripts

on:
  workflow_dispatch:
    inputs:
      url:
        description: Seed YouTube watch/shorts/youtu.be URL for the channel
        required: true
        default: https://www.youtube.com/watch?v=Tb6DhFy9N_A
      limit:
        description: Number of ranked channel videos to transcript-test first
        required: true
        default: "5"
      language:
        description: Preferred caption language code
        required: true
        default: ko
      timeout_ms:
        description: Scrapling browser timeout in milliseconds
        required: true
        default: "90000"
      wait_ms:
        description: Extra wait after page load in milliseconds
        required: true
        default: "5000"
      sleep_seconds:
        description: Delay between Scrapling transcript requests
        required: true
        default: "20"
      headless:
        description: Run browser headless
        type: boolean
        required: true
        default: true
      include_non_shorts:
        description: Include non-Shorts videos
        type: boolean
        required: true
        default: false

jobs:
  collect-and-transcript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project with Scrapling support
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[scrapling]"

      - name: Install Chromium for Scrapling/Patchright
        run: python -m patchright install --with-deps chromium

      - name: Collect channel metadata inside Actions
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::error::Set the YOUTUBE_API_KEY repository secret before running this workflow."
            exit 1
          fi
          mkdir -p output
          python -m yt_collector.cli collect \
            --url "${{ inputs.url }}" \
            --limit "${{ inputs.limit }}" \
            --format json \
            --out output/channel_collection.json

      - name: Fetch public captions through Scrapling inside Actions
        env:
          SCRAPLING_PROXY_URL: ${{ secrets.SCRAPLING_PROXY_URL }}
        run: |
          HEADLESS_FLAG="--headless"
          if [ "${{ inputs.headless }}" != "true" ]; then
            HEADLESS_FLAG="--headed"
          fi
          INCLUDE_FLAG=""
          if [ "${{ inputs.include_non_shorts }}" = "true" ]; then
            INCLUDE_FLAG="--include-non-shorts"
          fi
          python -m yt_collector.cli scrapling-transcripts \
            --collection output/channel_collection.json \
            --limit "${{ inputs.limit }}" \
            --language "${{ inputs.language }}" \
            --timeout-ms "${{ inputs.timeout_ms }}" \
            --wait-ms "${{ inputs.wait_ms }}" \
            --sleep-seconds "${{ inputs.sleep_seconds }}" \
            --stop-on-block \
            $HEADLESS_FLAG \
            $INCLUDE_FLAG \
            --out output/channel_scrapling_transcripts.json

      - name: Summarize result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('output/channel_scrapling_transcripts.json').read_text(encoding='utf-8'))
          summary = payload.get('transcript_collection', {})
          print('attempted=', summary.get('attempted'))
          print('found=', summary.get('found'))
          print('missing=', summary.get('missing'))
          print('stopped_by_block=', summary.get('stopped_by_block'))
          PY

      - name: Upload collection and transcript artifacts
        uses: actions/upload-artifact@v4
        with:
          name: channel-scrapling-transcripts
          path: |
            output/channel_collection.json
            output/channel_scrapling_transcripts.json
          if-no-files-found: error
